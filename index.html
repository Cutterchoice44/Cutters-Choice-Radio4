<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cutters Choice Radio</title>
  <style>
    :root {
      --brand-teal: #5A8785;
      --bg-dark: #111;
      --text-light: #fafafa;
    }

    body {
      margin: 0;
      background: var(--bg-dark);
      color: var(--text-light);
      font-family: Arial, sans-serif;
      line-height: 1.4;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 1rem;
      background: #000;
    }
    header .title h1 {
      font-size: 5.5rem;
      margin: 0;
    }
    header .title .tagline {
      font-size: 2.3rem;
      margin: 0;
    }

    .schedule h3 {
      border-top: 1px solid var(--brand-teal);
      padding-top: 0.6rem;
      margin-top: 1.4rem;
    }

    #mixcloud-list {
      overflow-y: visible;
      padding-right: 5px;
      margin-bottom: 1rem;
      border-radius: 6px;
      scroll-behavior: smooth;
      background: #000;
    }
    #mixcloud-list .mixcloud-container {
      position: relative;
      margin-bottom: 6px;
      background: #000;
      border-radius: 4px;
      overflow: hidden;
    }
    #mixcloud-list iframe {
      width: 100%;
      height: 180px;
      display: block;
      background: #000;
      border: none;
    }

    .delete-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: var(--brand-teal);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      z-index: 5;
    }

    .add-mixcloud {
      text-align: center;
      margin: 1rem 0;
    }
    .add-mixcloud input {
      width: 80%;
      max-width: 600px;
      padding: 0.5rem;
      font-size: 1rem;
    }
    .add-mixcloud button {
      padding: 0.5rem 2rem;
      font-size: 1rem;
      background: var(--brand-teal);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    footer.banner {
      display: flex;
      justify-content: center;
      gap: 1rem;
      background: var(--brand-teal);
      padding: 1rem;
    }
    footer.banner a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.4rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 0.5rem 1rem;
      transition: color 0.3s ease;
    }
    footer.banner a:hover {
      color: #fff;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        text-align: center;
      }
      header .title h1 {
        font-size: 2.5rem;
      }
      header .title .tagline {
        font-size: 1.4rem;
      }
      .add-mixcloud input {
        width: 95%;
      }
      .add-mixcloud button {
        width: 100%;
      }
      footer.banner {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="https://i.imgur.com/3eKO6TQ.png" alt="Cutters Choice Radio Logo" style="width:100%; max-width:250px; height:auto; margin-bottom:0.5rem;">
    <div class="title">
      <h1>Cutters Choice Radio</h1>
      <p class="tagline">The home of relentless flavas and significant bangers!</p>
    </div>
    <img class="logo" src="https://i.imgur.com/3eKO6TQ.png" alt="Cutters Choice Radio Logo" style="width:100%; max-width:250px; height:auto; margin-bottom:0.5rem;">
  </header>
  <div class="teal-line"></div>
  <!-- Additional page content would go here -->
</body>
</html>
